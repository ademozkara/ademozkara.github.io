<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hızlı Erişim Paneli</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
            --accent-color: #4a90e2;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        /* IP Bilgisi Alanı Tasarımı */
        .info-box {
            background: #2c3e50;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            max-width: 400px;
            margin: 0 auto 30px auto;
            font-size: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .info-box span {
            font-weight: bold;
            color: #2ecc71;
            background: rgba(255,255,255,0.1);
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 5px;
        }

        .category-title {
            margin-top: 30px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 5px;
            color: #2c3e50;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .card .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .card h3 {
            margin: 10px 0 5px 0;
            font-size: 18px;
        }
        .card p {
            margin: 0;
            font-size: 13px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Hızlı Erişim Panelim</h1>
    
    <div class="info-box">
        🌐 Bağlantı IP Adresiniz: <span id="ip-address">Yükleniyor...</span>
    </div>

    <h2 class="category-title">💻 İndirilen Uygulamalar</h2>
    <div class="grid">
        <a href="https://www.win-rar.com/postdownload.html" target="_blank" class="card">
            <div class="icon">📚</div>
            <h3>WinRAR</h3>
            <p>Dosya Sıkıştırma Programı</p>
        </a>

        <a href="https://code.visualstudio.com/sha/download?build=stable&os=win32-x64-user" target="_blank" class="card">
            <div class="icon">💙</div>
            <h3>VS Code</h3>
            <p>Kod Editörü</p>
        </a>
    </div>

    <h2 class="category-title">📂 Sık Kullanılan Dosyalar</h2>
    <div class="grid">
        <a href="https://drive.google.com/drive/folders/15J6Zr1fbSzyL5UvM99VxRNCnLtNYeow2?usp=drive_link" target="_blank" class="card">
    <div class="icon">📁</div>
    <h3>Yedekler Klasörü</h3>
    <p>Google Drive Üzerinde</p>
</a>
        
        <a href="C:\yedek" class="card">
            <div class="icon">📄</div>
            <h3>CV / Özgeçmiş</h3>
            <p>PDF Formatında</p>
        </a>
    </div>
</div>

<script>
    fetch('https://api.ipify.org?format=json')
        .then(response => response.json())
        .then(data => {
            document.getElementById('ip-address').innerText = data.ip;
        })
        .catch(error => {
            document.getElementById('ip-address').innerText = "Alınamadı";
            console.error('IP yüklenirken hata oluştu:', error);
        });
</script>

</body>
</html>
